name: Event kit

on:
  push:
    paths:
      - "event/**"
      - "delivery/**"
      - "challenges/**"
      - "judging/RUBRIC.md"
      - "deploy/**"
      - "*.md"
      - "package.json"
      - ".github/workflows/event-kit.yml"
  pull_request:
    paths:
      - "event/**"
      - "delivery/**"
      - "challenges/**"
      - "judging/RUBRIC.md"
      - "deploy/**"
      - "*.md"
      - "package.json"
      - ".github/workflows/event-kit.yml"

permissions:
  contents: read

jobs:
  event-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check event/public/app.js
